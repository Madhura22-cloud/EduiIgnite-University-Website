<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Student</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            width: 400px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        h2 {
            color: #d32f2f;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            border: none;
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 15px;
        }

        .delete {
            background: #d32f2f;
            color: white;
        }

        .cancel {
            background: #9e9e9e;
            color: white;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Delete Student</h2>
    <p>Are you sure you want to delete this student?</p>

    <form action="/admin/deleteStudent" method="post">
        <input type="hidden" name="studentId" value="">

        <input type="text" name="name" placeholder="Student Name" readonly>
        <input type="email" name="email" placeholder="Student Email" readonly>
        <input type="text" name="course" placeholder="Course" readonly>

        <button type="submit" class="delete">Yes, Delete</button>
        <a href="viewAdminStudents.html">
            <button type="button" class="cancel">Cancel</button>
        </a>
    </form>
</div>

</body>
</html>
