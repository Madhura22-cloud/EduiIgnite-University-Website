<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Signup</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f7; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .signup-container { background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 400px; text-align: center; }
    h2 { margin-bottom: 30px; color: #333; }
    input, select { width: 100%; padding: 12px 15px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #2196F3; border: none; color: #fff; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #0b7dda; }
    p { margin-top: 15px; }
    a { color: #2196F3; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="signup-container">
    <h2>Student Signup</h2>
    <form id="signupForm">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="email" id="email" placeholder="Email Address" required>
      <input type="tel" id="contact" placeholder="Phone Number" required>
      <input type="password" id="password" placeholder="Password" required>
      <input type="password" id="confirm_password" placeholder="Confirm Password" required>
      <select id="course" required>
        <option value="">Select Course</option>
        <option value="1">Computer Science</option>
        <option value="2">Information Technology</option>
        <option value="3">Mechanical Engineering</option>
      </select>
      <button type="submit">Signup</button>
    </form>
    <p>Already have an account? <a href="student-login.html">Login Here</a></p>
  </div>

  <script>
    const form = document.getElementById('signupForm');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;
      if(password !== confirmPassword){
        alert("Passwords do not match!");
        return;
      }

      const student = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        contact: document.getElementById('contact').value,
        password: password,
        course: { courseId: parseInt(document.getElementById('course').value) }
      };

      const res = await fetch('http://localhost:8081/api/students/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(student)
      });

      if(res.ok){
        alert('Signup Successful! Please Login.');
        window.location.href = 'student-login.html';
      } else {
        alert('Signup Failed!');
      }
    });
  </script>
</body>
</html>
