<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .header {
      background: #2196F3;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 22px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 40px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .card a {
      text-decoration: none;
      color: #2196F3;
      font-size: 18px;
      font-weight: bold;
      display: block;
    }

    .logout {
      text-align: center;
      margin-top: 20px;
    }

    .logout a {
      color: red;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="header">Admin Dashboard</div>

<div class="dashboard">
  <div class="card"><a href="add-student.html">Add Student</a></div>
  <div class="card"><a href="view-students.html">View Students</a></div>
  <div class="card"><a href="update-Student.html">Update Student</a></div>
  <div class="card"><a href="delete-student.html">Delete Student</a></div>
  <div class="card"><a href="manage-Courses.html">Manage Courses</a></div>
  <div class="card"><a href="add-course.html">Add Course</a></div>
</div>

<div class="logout">
  <a href="../admin-login.html">Logout</a>
</div>

</body>
</html>
