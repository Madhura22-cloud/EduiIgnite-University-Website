<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f7; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-container { background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 350px; text-align: center; }
    h2 { margin-bottom: 30px; color: #333; }
    input { width: 100%; padding: 12px 15px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #4CAF50; border: none; color: #fff; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #45a049; }
    p { margin-top: 15px; }
    a { color: #2196F3; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Student Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="student-signup.html">Signup Here</a></p>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const student = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      const res = await fetch('http://localhost:8081/api/students/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(student)
      });

      const data = await res.json();
      if(data && data.studentId){
        localStorage.setItem('studentId', data.studentId);
        localStorage.setItem('studentName', data.name);
        alert('Login Successful!');
        window.location.href = 'student-dashboard.html';
      } else {
        alert('Invalid email or password!');
      }
    });
  </script>
</body>
</html>
